<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas | Live Interview</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">

    <style>
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 4px; }
        
        .waveform { height: 40px; display: flex; align-items: center; gap: 4px; }
        .bar { width: 5px; background: #38bdf8; border-radius: 2px; animation: wave 1s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { height: 5px; opacity: 0.5; } 50% { height: 35px; opacity: 1; } }
        .bar:nth-child(odd) { animation-duration: 0.8s; }
        .bar:nth-child(even) { animation-duration: 1.1s; }
        
        .mic-active { box-shadow: 0 0 20px #ef4444; border-color: #ef4444; color: #ef4444; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        .msg-ai { align-self: flex-start; background: rgba(56, 189, 248, 0.15); border-left: 3px solid #38bdf8; padding: 10px; border-radius: 0 10px 10px 10px; margin-bottom: 8px; font-size: 0.85rem; max-width: 90%; }
        .msg-user { align-self: flex-end; background: rgba(234, 179, 8, 0.15); border-right: 3px solid #eab308; padding: 10px; border-radius: 10px 0 10px 10px; margin-bottom: 8px; font-size: 0.85rem; text-align: right; margin-left: auto; max-width: 90%; }
    </style>
</head>
<body class="flex flex-col h-screen p-4 bg-black text-white font-sans overflow-hidden">

    <!-- Anti-Cheat Overlay -->
    <div id="cheatWarning" class="hidden fixed inset-0 bg-red-900/90 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="text-center">
            <h1 class="text-6xl mb-4">⚠️</h1>
            <h2 class="text-3xl font-bold">PROCTORING ALERT</h2>
            <p id="warningReason" class="text-xl mt-2 font-mono text-red-200">Looking away detected</p>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="startOverlay" class="fixed inset-0 bg-black/95 z-40 flex flex-col items-center justify-center">
        <div class="glass p-8 rounded-2xl text-center max-w-lg border border-sky-500/30 w-full mx-4">
            <h1 class="text-3xl font-bold mb-4">Start Interview</h1>
            
            <div class="space-y-4 text-left">
                <input id="candidateNameInput" type="text" placeholder="Full Name" class="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-sky-500 outline-none transition">
                <input id="candidateEmailInput" type="email" placeholder="Email" class="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-sky-500 outline-none transition">
                
                <div class="flex items-center gap-2 mt-2">
                    <input id="optIn" type="checkbox" class="accent-sky-500 w-4 h-4 cursor-pointer">
                    <label for="optIn" class="text-xs text-gray-400 cursor-pointer select-none">Join Talent Network (Marketing Opt-in)</label>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <select id="languageInput" class="w-full bg-black border border-gray-700 rounded p-3 text-white focus:border-sky-500 outline-none">
                        <option value="English">English</option>
                        <option value="Burmese">Burmese (Myanmar)</option>
                        <option value="Spanish">Spanish</option>
                        <option value="French">French</option>
                        <option value="German">German</option>
                        <option value="Hindi">Hindi</option>
                        <option value="Japanese">Japanese</option>
                    </select>
                    <input id="resumeInput" type="file" class="w-full text-xs text-gray-400 file:bg-gray-800 file:text-white file:border-0 file:rounded file:px-2 file:py-1 mt-1 cursor-pointer">
                </div>
            </div>

            <button onclick="beginInterview()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-4 rounded-xl mt-6 transition shadow-lg transform hover:scale-[1.02]">
                BEGIN SESSION
            </button>
            <p id="initStatus" class="mt-4 text-xs text-gray-500"></p>
        </div>
    </div>

    <!-- Header -->
    <header class="flex justify-between items-center mb-4 px-4 py-2 glass rounded-xl border border-gray-800 h-16 shrink-0">
        <div class="font-bold text-xl tracking-wider">ATLAS <span class="text-sky-400">AI</span></div>
        <div class="flex gap-3">
            <div id="recordingIndicator" class="hidden flex items-center gap-2 text-red-500 text-xs font-bold animate-pulse">
                <i class="fa-solid fa-circle"></i> REC
            </div>
            <div id="confidenceMeter" class="px-3 py-1 rounded bg-gray-900 text-xs border border-gray-700 flex items-center">Conf: 0%</div>
            <div id="agentName" class="px-3 py-1 rounded bg-sky-900/30 text-sky-300 text-xs font-bold uppercase flex items-center">LOADING...</div>
        </div>
    </header>

    <!-- MAIN GRID (3 Columns) -->
    <main class="flex-1 grid grid-cols-12 gap-4 relative w-full h-[calc(100vh-140px)]">
        
        <!-- 1. AI View -->
        <div class="col-span-4 glass rounded-2xl flex flex-col items-center justify-center relative p-4 border border-gray-700 bg-gray-900/20 h-full">
            <div class="absolute top-3 left-3 text-xs text-sky-400 font-bold tracking-widest">INTERVIEWER</div>
            <!-- AI Avatar (Circle) -->
            <div id="aiAvatar" class="w-32 h-32 md:w-48 md:h-48 rounded-full bg-black/60 flex items-center justify-center border-[3px] border-sky-500/30 shadow-[0_0_40px_rgba(14,165,233,0.15)] relative overflow-hidden">
                <i class="fa-solid fa-robot text-5xl md:text-7xl text-gray-300"></i>
            </div>
            <div id="aiWave" class="waveform mt-6 opacity-0 transition-opacity duration-300">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
            </div>
            <p id="statusText" class="mt-4 text-sky-400/80 text-xs font-mono">WAITING...</p>
        </div>

        <!-- 2. User View -->
        <div class="col-span-5 glass rounded-2xl p-2 bg-black/40 border border-gray-700 relative overflow-hidden h-full">
            <div class="absolute top-3 left-3 z-10 bg-black/60 px-2 py-1 rounded text-[10px] text-white border border-white/10">CANDIDATE</div>
            <video id="userVideo" autoplay muted playsinline class="w-full h-full object-cover rounded-xl transform scale-x-[-1]"></video>
        </div>

        <!-- 3. Transcript -->
        <div class="col-span-3 glass rounded-2xl p-3 border border-gray-700 bg-black/60 flex flex-col h-full min-h-0">
            <div class="text-[10px] text-gray-500 font-bold uppercase mb-2 border-b border-gray-700 pb-1 flex justify-between items-center shrink-0">
                <span>Transcript</span>
                <i class="fa-regular fa-comments text-sky-500"></i>
            </div>
            <div id="transcript" class="flex-1 flex flex-col gap-2 overflow-y-auto custom-scroll pr-1">
                <div class="text-center text-gray-700 text-xs mt-4 italic">Secure Connection Established.</div>
            </div>
        </div>

    </main>

    <!-- Controls -->
    <div class="fixed bottom-0 left-0 w-full p-4 z-40 h-20 bg-gradient-to-t from-black to-transparent">
        <div class="max-w-4xl mx-auto flex gap-4 items-center h-full">
            <div class="flex-1 glass rounded-full p-1 flex items-center border border-gray-700 bg-black/80 h-12">
                <input id="userTextInput" type="text" placeholder="Your answer (Speak or Type)..." class="w-full bg-transparent text-white px-4 py-2 outline-none text-sm">
                <button onclick="sendText()" class="bg-sky-600 w-10 h-10 rounded-full text-white hover:bg-sky-500 transition flex items-center justify-center mr-1">
                    <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </div>
            <button id="micBtn" class="w-14 h-14 rounded-full bg-sky-600 flex items-center justify-center text-xl text-white hover:bg-sky-500 shadow-lg transition transform hover:scale-105 border-4 border-black">
                <i class="fa-solid fa-microphone"></i>
            </button>
            <button onclick="finishSession()" class="w-12 h-12 rounded-full bg-red-900/80 border border-red-500 text-red-500 flex items-center justify-center text-lg hover:bg-red-600 hover:text-white transition shadow-lg">
                <i class="fa-solid fa-flag-checkered"></i>
            </button>
        </div>
    </div>

    <!-- LOGIC SCRIPT -->
    <script>
        const API = "http://127.0.0.1:8000";
        const agentId = new URLSearchParams(window.location.search).get('id');
        
        let sessionId = null, recognition = null, isRecording = false;
        let emotionsLog = { happy: 0, neutral: 0, fearful: 0, sad: 0, total: 0 };
        let mediaRecorder, videoChunks = [];
        let cheatWarnings = 0;
        
        // Language Mapping
        let selectedLangCode = "en-US";
        const langMap = {
            "English": "en-US", "Burmese": "my-MM", "Spanish": "es-ES",
            "French": "fr-FR", "German": "de-DE", "Hindi": "hi-IN", "Japanese": "ja-JP"
        };

        window.onload = async () => {
            if(!agentId) { window.location.href="dashboard.html"; return; }
            try { await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri('models'), faceapi.nets.faceExpressionNet.loadFromUri('models')]); } catch(e){}
            
            try {
                const res = await fetch(`${API}/get_agent/${agentId}`);
                if(res.ok) {
                    const agent = await res.json();
                    document.getElementById("agentName").innerText = agent.name.toUpperCase();
                    
                    // LOGO SWAP LOGIC (Premium)
                    if (agent.logo) {
                        const avatarContainer = document.getElementById("aiAvatar");
                        avatarContainer.innerHTML = "";
                        const img = document.createElement("img");
                        img.src = agent.logo;
                        img.className = "w-full h-full object-cover rounded-full";
                        avatarContainer.appendChild(img);
                        avatarContainer.classList.remove("border-[3px]", "border-sky-500/30");
                        avatarContainer.classList.add("border-2", "border-white/20");
                    }
                }
            } catch(e) { document.getElementById("initStatus").innerText = "⚠️ Backend Offline."; }
        };

        async function beginInterview() {
            const name = document.getElementById("candidateNameInput").value;
            const email = document.getElementById("candidateEmailInput").value;
            const lang = document.getElementById("languageInput").value;
            const optIn = document.getElementById("optIn").checked;
            const resume = document.getElementById("resumeInput").files[0];

            selectedLangCode = langMap[lang] || "en-US";

            if(!name || !email) { alert("Please enter Name and Email."); return; }
            
            document.getElementById("initStatus").innerText = "Analyzing Resume & Connecting...";
            
            const fd = new FormData();
            fd.append("agent_id", agentId); fd.append("candidate_name", name);
            fd.append("candidate_email", email); fd.append("language", lang);
            fd.append("newsletter_optin", optIn);
            if(resume) fd.append("resume", resume);
            
            try {
                const res = await fetch(`${API}/start_interview`, { method: "POST", body: fd });
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                sessionId = data.session_id;
                
                document.getElementById("startOverlay").style.display = "none";
                document.getElementById("transcript").innerHTML = ""; 
                addLog("AI", data.text);
                playAudio(data.audio_url);
                setupHardware();
            } catch(e) { document.getElementById("initStatus").innerText = "Connection Failed."; }
        }

        async function setupHardware() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById("userVideo").srcObject = stream;
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => { if(e.data.size > 0) videoChunks.push(e.data); };
                mediaRecorder.start();
                document.getElementById("recordingIndicator").classList.remove("hidden");
                
                const video = document.getElementById("userVideo");
                video.addEventListener('play', () => {
                    setInterval(async () => {
                        if (!faceapi.nets.tinyFaceDetector.params) return;
                        try {
                            const dets = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions()).withFaceExpressions();
                            
                            // CHEAT DETECTION
                            let cheating = false;
                            let reason = "";

                            if (dets.length === 0) { cheating = true; reason = "Face Not Detected"; }
                            else if (dets.length > 1) { cheating = true; reason = "Multiple People"; }
                            else {
                                hideWarn();
                                const box = dets[0].detection.box;
                                if (box.x < 10 || box.y < 10 || (box.x+box.width) > video.width-10) { cheating = true; reason = "Eyes Off Screen"; }
                                const ex = dets[0].expressions;
                                const dom = Object.keys(ex).reduce((a, b) => ex[a] > ex[b] ? a : b);
                                if(emotionsLog[dom] !== undefined) emotionsLog[dom]++;
                                emotionsLog.total++;
                                const conf = Math.round(((emotionsLog.happy + emotionsLog.neutral) / (emotionsLog.total || 1)) * 100);
                                document.getElementById("confidenceMeter").innerText = `Conf: ${conf}%`;
                            }
                            if (cheating) handleCheat(reason);
                        } catch(e) {}
                    }, 1500);
                });
            } catch(e) { alert("Camera Access Required."); }

            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.lang = selectedLangCode;
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.onresult = e => {
                    let txt = "";
                    for (let i = e.resultIndex; i < e.results.length; ++i) txt += e.results[i][0].transcript;
                    document.getElementById("userTextInput").value = txt;
                };
                document.getElementById("micBtn").onclick = toggleMic;
            }
        }

        function handleCheat(reason) {
            cheatWarnings++;
            showWarn(`${reason} (${cheatWarnings}/3)`);
            const fd = new FormData(); fd.append("session_id", sessionId);
            fetch(`${API}/log_cheat`, { method: "POST", body: fd });
            if (cheatWarnings >= 3) {
                alert("🚫 INTERVIEW TERMINATED\n\nSuspicious activity detected 3 times.\nYou have been flagged.");
                finishSession(true);
            }
        }

        function toggleMic() {
            if (isRecording) {
                recognition.stop();
                isRecording = false;
                document.getElementById("micBtn").classList.remove("mic-active");
                document.getElementById("statusText").innerText = "READY";
            } else {
                recognition.start();
                isRecording = true;
                document.getElementById("micBtn").classList.add("mic-active");
                document.getElementById("statusText").innerText = "LISTENING...";
            }
        }

        function showWarn(msg) {
            document.getElementById("warningReason").innerText = msg;
            document.getElementById("cheatWarning").classList.remove("hidden");
            setTimeout(() => document.getElementById("cheatWarning").classList.add("hidden"), 2000);
        }
        function hideWarn() { document.getElementById("cheatWarning").classList.add("hidden"); }

        async function sendText() {
            const txt = document.getElementById("userTextInput").value;
            if(!txt) return;
            document.getElementById("userTextInput").value = "";
            addLog("YOU", txt);
            
            const fd = new FormData(); fd.append("session_id", sessionId); fd.append("agent_id", agentId); fd.append("user_input", txt);
            try {
                const res = await fetch(`${API}/chat`, { method: "POST", body: fd });
                const data = await res.json();
                addLog("AI", data.text);
                playAudio(data.audio_url);
            } catch(e) { addLog("SYS", "Error connecting."); }
        }

        function playAudio(url) {
            const audio = new Audio(url);
            document.getElementById("statusText").innerText = "SPEAKING...";
            document.getElementById("aiWave").classList.remove("opacity-0");
            audio.play();
            audio.onended = () => {
                document.getElementById("aiWave").classList.add("opacity-0");
                document.getElementById("statusText").innerText = "WAITING...";
            };
        }

        function addLog(role, text) {
            const box = document.getElementById("transcript");
            const div = document.createElement("div");
            div.className = role === "AI" ? "msg-ai" : "msg-user";
            div.innerText = text;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        async function finishSession(forced = false) {
            if(!forced && !confirm("End Interview?")) return;
            mediaRecorder.stop(); 
            document.getElementById("statusText").innerText="UPLOADING...";
            await new Promise(r=>setTimeout(r,1000));
            
            const b = new Blob(videoChunks, {type:'video/webm'});
            const vf = new FormData(); vf.append("session_id", sessionId); vf.append("file", b, "rec.webm");
            
            const summary = `Confidence: ${Math.round(((emotionsLog.happy + emotionsLog.neutral) / (emotionsLog.total||1)) * 100)}%`;
            const fd = new FormData(); fd.append("session_id", sessionId); fd.append("emotion_log", summary); fd.append("cheat_log", cheatWarnings);
            
            try {
                const [vidRes, reportRes] = await Promise.all([
                    fetch(`${API}/upload_video`, { method: "POST", body: vf }),
                    fetch(`${API}/end_interview`, { method: "POST", body: fd })
                ]);
                const data = await reportRes.json();
                if(!forced) {
                    alert(`--- RESULTS ---\n\nRECOMMENDATION: ${data.report.recommendation}\nSCORE: ${data.report.score}/100\n\n${data.report.summary}`);
                }
                window.location.replace("dashboard.html");
            } catch(e) {
                alert("Error generating report. Check dashboard later.");
                window.location.replace("dashboard.html");
            }
        }
        
        document.addEventListener("visibilitychange", () => {
            if(document.hidden) handleCheat("Tab Switching");
        });
    </script>
</body>
</html>
